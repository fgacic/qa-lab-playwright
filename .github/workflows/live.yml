name: Live site

# The same suite against the public practicesoftwaretesting.com, nightly and on demand.
# Disabled in GitHub Actions for now (gh workflow enable "Live site" turns it back on). A signal,
# not a gate: the site is shared and changes under us. Real accounts, real sign-ins and submitted
# payloads stay off here (src/support/env.ts); the config keeps it to two workers.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  # A queued nightly run must not cancel one that is mid-way through the shared public site: it waits instead.
  cancel-in-progress: false

env:
  CI: true
  TARGET: live

jobs:
  live:
    name: live (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One job at a time: with the config's two workers, never more than two browsers on the public site.
      max-parallel: 1
      matrix:
        # Firefox and WebKit are gated on the self-hosted shop. Here, fewer requests also mean fewer
        # Cloudflare bot challenges from the runner's datacenter IP (src/support/bot-challenge.ts).
        project: [chromium, mobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
          save-browsers: 'true' # max-parallel is 1: the jobs run one after the other, so none races another for the entry
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          REPORT_ID: live-${{ matrix.project }}
      # The signal of this workflow is its failure: say on the run page what failed and where to look, not only that a job is red.
      - name: Failure summary
        if: ${{ failure() }}
        env:
          PROJECT: ${{ matrix.project }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Live site: the \`$PROJECT\` project failed"
            echo
            echo "The public shop is shared and changes under the suite, so a red run is a signal to look at, not a verdict."
            echo "- Failing tests and traces: the \`live-playwright-report\` artifact of [this run]($RUN_URL)."
            echo "- Many tests skipped as a Cloudflare bot challenge: the runner was challenged, not the shop (the run-guard reporter fails above 20 %)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: live-blob-${{ matrix.project }}
          path: blob-report/
          retention-days: 7

  report:
    needs: live
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: none
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: live-blob-*
          path: all-blob-reports
          merge-multiple: true
      # Both live jobs can end before they upload (a cancelled run, a runner that never started): then there is nothing to merge.
      - id: blobs
        run: |
          if compgen -G 'all-blob-reports/*.zip' > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::warning::no blob report was uploaded, so there is no report to merge"; fi
      - if: steps.blobs.outputs.found == 'true'
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - if: steps.blobs.outputs.found == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: live-playwright-report
          path: playwright-report/
          retention-days: 7
