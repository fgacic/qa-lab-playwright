name: Live site

# The same suite against the public practicesoftwaretesting.com, nightly and on demand. A signal,
# not a gate: the site is shared and changes under us. Real accounts, real sign-ins and submitted
# payloads stay off here (src/support/env.ts); the config keeps it to two workers.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

env:
  CI: true
  TARGET: live

jobs:
  live:
    name: live (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One job at a time: with the config's two workers, never more than two browsers on the public site.
      max-parallel: 1
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-suite
        with:
          browsers: ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          REPORT_ID: live-${{ matrix.project }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: live-blob-${{ matrix.project }}
          path: blob-report/
          retention-days: 7

  report:
    needs: live
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-suite
        with:
          browsers: none
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: live-blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: live-playwright-report
          path: playwright-report/
          retention-days: 14
