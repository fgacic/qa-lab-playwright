name: CI

# The gate: the whole suite against the self-hosted Toolshop (TARGET=local), on pushes to main,
# on pull requests (a branch with an open PR runs once, not twice), nightly, and on demand. The public site is checked separately (live.yml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      record_perf_baseline:
        description: Record the `ci` performance baseline on a runner and upload it as an artifact (committing it is a human step, see README)
        type: boolean
        default: false

permissions:
  contents: read

# The nightly run has a group of its own: sharing one with pushes, a queued schedule would replace the
# pending push run of main (GitHub keeps one pending run per group), and a push would be dropped.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TARGET: local

jobs:
  static:
    name: typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: none
      - run: npm run typecheck
      - run: npm run lint
      # The workflows and composite actions are code too: a typo in an expression or an `if:` that never matches fails here,
      # not on the one run that takes that path. The image is pinned by digest (the tag is only for the reader); run it locally with the same command.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      # The visual baselines are only valid in the image of the installed Playwright version, and the
      # tag in scripts/visual.sh is typed by hand: a bump of @playwright/test must not leave it behind.
      - name: The visual image matches @playwright/test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          grep -Eq "mcr.microsoft.com/playwright:v${version}-[a-z]+@sha256:[0-9a-f]{64}" scripts/visual.sh \
            || { echo "::error file=scripts/visual.sh::the pinned Playwright image is not v${version} pinned by digest (image:vX-flavour@sha256:...), the installed @playwright/test"; exit 1; }

  e2e:
    name: e2e (${{ matrix.id }})
    needs: static
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_perf_baseline) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `save-browsers`: one job per browser writes the browser cache. Jobs of one run that share a key and all miss it
        # would otherwise each try to save it at the same moment, and all but one end in an "Unable to reserve cache" warning.
        include:
          - { id: chromium-1, browsers: chromium, projects: --project=chromium, shard: 1/3, save-browsers: true }
          - { id: chromium-2, browsers: chromium, projects: --project=chromium, shard: 2/3 }
          - { id: chromium-3, browsers: chromium, projects: --project=chromium, shard: 3/3 }
          - { id: firefox-1, browsers: firefox, projects: --project=firefox, shard: 1/2, save-browsers: true }
          - { id: firefox-2, browsers: firefox, projects: --project=firefox, shard: 2/2 }
          - { id: webkit-1, browsers: webkit, projects: --project=webkit, shard: 1/2, save-browsers: true }
          - { id: webkit-2, browsers: webkit, projects: --project=webkit, shard: 2/2 }
          # Performance budgets: one worker on a runner of their own, so no other test competes for the CPU.
          - { id: perf, browsers: chromium, projects: --project=perf, shard: 1/1 }
          # Real sign-ins against our own Toolshop, in a pass of their own: the saved session lives 300 s, so
          # nothing else may run between the setup and the specs that use it (fixtures/auth.ts, `storage-state`).
          - { id: sessions, browsers: chromium, projects: --project=account --project=admin, shard: 1/1 }
          # The suite's own plumbing (the mock layer, the target configuration, the defect-id bookkeeping), once.
          # The answer-gate control and the verify-bugs self-tests launch Firefox and WebKit themselves.
          - { id: framework, browsers: chromium firefox webkit, projects: --project=framework, shard: 1/1 }
          # The phone smoke set.
          - { id: mobile, browsers: chromium, projects: --project=mobile, shard: 1/1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: ${{ matrix.browsers }}
          save-browsers: ${{ matrix.save-browsers || 'false' }}
      - uses: ./.github/actions/toolshop
        with:
          # One job per run writes the image cache (and only on main); every job reads it.
          cache-write: ${{ github.ref == 'refs/heads/main' && matrix.id == 'chromium-1' }}
      - name: Run the suite
        run: npx playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}
        env:
          REPORT_ID: ${{ matrix.id }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.id }}
          path: blob-report/
          retention-days: 7
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-${{ matrix.id }}
          path: allure-results/
          retention-days: 7

  visual:
    name: visual (Playwright image)
    needs: static
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_perf_baseline) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: none
      - uses: ./.github/actions/toolshop
      # Baselines are recorded in the Playwright image scripts/visual.sh pins (the static job checks
      # it matches @playwright/test); comparing in the same image means the same fonts and rendering.
      - name: Compare screenshots in the Playwright image
        run: npm run test:visual
        env:
          REPORT_ID: visual
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-visual
          path: blob-report/
          retention-days: 7
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-visual
          path: allure-results/
          retention-days: 7

  verify-bugs:
    name: known bugs still reproduce (${{ matrix.id }})
    needs: static
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_perf_baseline) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Every pin is verified in every project that schedules it, which is 636 runs (24 minutes on a laptop, more on a runner): one job for
        # the lot would not fit its former 20 minutes. One shard per engine, and one for the other projects (mobile, account, admin, perf: all Chromium), so each fits.
        # `args` is the project filter of scripts/verify-bugs.mjs. The browser cache is written by the e2e jobs, which share these keys.
        include:
          - { id: chromium, browsers: chromium, args: --project=chromium }
          - { id: firefox, browsers: firefox, args: --project=firefox }
          - { id: webkit, browsers: webkit, args: --project=webkit }
          - { id: others, browsers: chromium, args: --skip-project=chromium --skip-project=firefox --skip-project=webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: ${{ matrix.browsers }}
      - uses: ./.github/actions/toolshop
      # Every knownBug() spec runs as a plain test in each engine that schedules it and must fail as pinned; one that passes is a fix to
      # record. The script runs the perf pins in a pass of their own (the perf project is measured alone).
      - run: npm run test:verify-bugs -- ${{ matrix.args }}
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-bugs-${{ matrix.id }}
          path: test-results/verify-bugs.json
          retention-days: 7

  # Manual only: measures the perf project on a runner with UPDATE_PERF_BASELINE=1 and uploads
  # tests/performance/baseline.json. The `ci` entries in it are what the runner is held to; a person
  # downloads the artifact, reviews the diff and commits the file. Not part of the gate, and for that dispatch it is the
  # only job besides `static`: the e2e, visual and verify-bugs jobs (and what depends on them) are skipped, so recording a
  # baseline does not also spend a whole run of the suite.
  record-perf-baseline:
    name: record the ci performance baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_perf_baseline }}
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: chromium
      - uses: ./.github/actions/toolshop
      - name: Measure and record
        run: npx playwright test --project=perf --workers=1
        env:
          UPDATE_PERF_BASELINE: '1'
          REPORT_ID: record-perf-baseline
      - name: Upload the baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baseline-ci
          path: tests/performance/baseline.json
          retention-days: 30

  # Runs after failed e2e/visual jobs on purpose (`!cancelled()`, and the Pages publish below only
  # needs this job to succeed): the Allure history and trend charts must record the red runs too,
  # and the published report is how a failure gets investigated. The gate itself is the `gate` job below.
  report:
    name: merge reports
    needs: [static, e2e, visual]
    # Not after a failed static job: e2e and visual never ran then, so there would be no blob to merge.
    if: ${{ !cancelled() && needs.static.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.record_perf_baseline) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this workflow pushes
      - uses: ./.github/actions/setup-suite
        with:
          browsers: none

      - name: Collect the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: One HTML report from every shard
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Collect the Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # Trend, Duration and Retries charts need the history of earlier runs: take the history file
      # published with the last report, let this run append to it, publish it again.
      - name: Fetch the Allure history of earlier runs
        run: |
          mkdir -p allure-history
          if curl -fsSL "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/history/history.jsonl" -o allure-history/history.jsonl; then
            echo "history: $(wc -l < allure-history/history.jsonl) earlier runs"
          else
            echo "no published history yet, starting one"
            rm -f allure-history/history.jsonl
          fi
          # A truncated download or an error page served with 200 would poison every later report:
          # reuse the file only when every line parses as JSON.
          if [ -f allure-history/history.jsonl ] && ! node -e '
            const lines = require("fs").readFileSync("allure-history/history.jsonl", "utf8").split("\n").filter(Boolean);
            if (!lines.length) process.exit(1);
            lines.forEach((line) => JSON.parse(line));
          '; then
            echo "::warning::the published history is not valid JSON Lines; starting a new one"
            rm -f allure-history/history.jsonl
          fi
      - name: Generate the Allure report
        run: npx allure generate allure-results
      - name: Assemble the site
        run: |
          mkdir -p site/history site/playwright
          cp -r allure-report/. site/
          # The very first run starts the history: tolerate a generation that wrote none.
          if [ -f allure-history/history.jsonl ]; then cp allure-history/history.jsonl site/history/history.jsonl; else echo "no history file was written; publishing without one"; fi
          cp -r playwright-report/. site/playwright/
          touch site/.nojekyll

      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload the Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # The one check for branch protection to require: red when any of the gating jobs is red, skipped or cancelled.
  gate:
    name: gate
    needs: [static, e2e, visual, verify-bugs]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.record_perf_baseline) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gating job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a gating job finished as '$result'"; exit 1; }
          done

  deploy-pages:
    name: publish to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
