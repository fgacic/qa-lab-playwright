name: Start the self-hosted Toolshop
description: Build the Toolshop images with a GitHub Actions layer cache, start, seed and health-check them.
runs:
  using: composite
  steps:
    - name: Read the pinned Toolshop commit
      shell: bash
      run: grep '^TOOLSHOP_REF=' .env.toolshop >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

    # Same images as `docker compose build`, but with layers cached across runs: the PHP
    # extensions and the Angular build are only rebuilt when TOOLSHOP_REF or a Dockerfile changes.
    - name: Build the images
      uses: docker/bake-action@7bff531c65a5cda33e52e43950a795b91d450f63 # v6.3.0
      with:
        source: .
        files: docker-compose.yml
        load: true
        set: |
          *.cache-from=type=gha,scope=toolshop
          *.cache-to=type=gha,scope=toolshop,mode=max

    - name: Start, seed and wait until healthy
      shell: bash
      env:
        TOOLSHOP_BUILD: '0'
      run: npm run toolshop:up
