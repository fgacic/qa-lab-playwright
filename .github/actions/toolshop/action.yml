name: Start the self-hosted Toolshop
description: Build the Toolshop images with a GitHub Actions layer cache, start, seed and health-check them.
inputs:
  cache-write:
    description: >-
      "true" to write the Docker layer cache after the build. Every job reads it, but the layers are the
      same in all of them, so one job per run (on main) writes it instead of eleven.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Read the pinned Toolshop commit
      shell: bash
      run: grep '^TOOLSHOP_REF=' .env.toolshop >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Same images as `docker compose build`, but with layers cached across runs: the PHP
    # extensions and the Angular build are only rebuilt when TOOLSHOP_REF or a Dockerfile changes.
    - name: Build the images
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
      with:
        source: .
        files: docker-compose.yml
        load: true
        set: |
          *.cache-from=type=gha,scope=toolshop
          ${{ inputs.cache-write == 'true' && '*.cache-to=type=gha,scope=toolshop,mode=max' || '' }}

    - name: Start, seed and wait until healthy
      shell: bash
      env:
        TOOLSHOP_BUILD: '0'
      run: npm run toolshop:up

    # The reason a stack that never became healthy is in the containers' logs, which vanish with the runner.
    - name: Container logs of a failed start
      if: ${{ failure() }}
      shell: bash
      run: docker compose --env-file .env.toolshop logs --no-color --tail=200
