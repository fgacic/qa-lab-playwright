name: Set up the suite
description: Node with the npm cache, npm ci, and Playwright browsers from cache.
inputs:
  browsers:
    description: Space-separated browsers to install, or "none".
    default: chromium
  save-browsers:
    description: >-
      "true" to save the browser cache when it missed. Several jobs of one run that share a cache key must not all save it:
      they would race for the same entry, so the caller names the one job per key that does.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # No package in package-lock.json has `hasInstallScript` (checked for all 268, @playwright/test, playwright and
    # playwright-core included; there is no esbuild), and browsers come from `playwright install` below. So skipping
    # scripts loses nothing, and a compromised package cannot execute code at install time.
    - run: npm ci --ignore-scripts
      shell: bash

    - name: Playwright version
      id: pw
      if: inputs.browsers != 'none'
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Restore and save are separate steps (not the combined actions/cache): its automatic save runs only when the whole job
    # succeeds, so a red run would throw away the browsers it had just downloaded and the next run would download them again.
    - name: Restore Playwright browsers
      id: browser-cache
      if: inputs.browsers != 'none'
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}

    # Browsers come from the cache when it hits; the system libraries they need never do.
    - name: Install browsers
      if: inputs.browsers != 'none' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}
    - name: Install browser system dependencies
      if: inputs.browsers != 'none' && steps.browser-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps ${{ inputs.browsers }}

    # Saved right after the install, before any test runs, whatever the job does later.
    - name: Save Playwright browsers
      if: ${{ always() && inputs.browsers != 'none' && inputs.save-browsers == 'true' && steps.browser-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}
