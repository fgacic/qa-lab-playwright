# Serves the Angular build with a single-page-app fallback, and the API on the same origin
# under /api (proxied to the Laravel web server). Same-origin means the shop works from any
# host name: localhost on a CI runner, host.docker.internal from the Playwright container.
server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        # /api/sales-stream is Server-Sent Events: pass events through as they are written.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
