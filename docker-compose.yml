# Self-hosted Toolshop (sprint 5): the suite's main target in CI and locally.
# Built from source at TOOLSHOP_REF, pinned in .env: the commit the public site runs
# ("v2.5 | Built 2026-10-11", main @ ae7caec), so both targets run the same code.
#   npm run toolshop:up     build, start, seed and wait until healthy (uses .env.toolshop)
#   npm run toolshop:down   stop and remove everything, data included
# UI http://localhost:4200, API http://localhost:4200/api (also direct on http://localhost:8091)
name: toolshop

services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11@sha256:8bb25ca2d68c81118fcf745959560de2f316a178abf9decc8bb5b6f86c929084
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 3s
      timeout: 3s
      retries: 40

  laravel-api:
    image: qa-lab/toolshop-api:${TOOLSHOP_REF}
    build:
      context: .
      dockerfile: docker/toolshop-api.Dockerfile
      args:
        TOOLSHOP_REF: ${TOOLSHOP_REF:?set in .env}
    environment:
      DB_HOST: mariadb
      DB_PORT: '3306'
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: '1'
      DISABLE_LOGGING: 'true'
    depends_on:
      mariadb:
        condition: service_healthy

  web:
    image: qa-lab/toolshop-web:${TOOLSHOP_REF}
    build:
      context: .
      dockerfile: docker/toolshop-web.Dockerfile
    ports:
      - '8091:80'
    depends_on:
      - laravel-api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/status']
      interval: 3s
      timeout: 3s
      retries: 60

  ui:
    image: qa-lab/toolshop-ui:${TOOLSHOP_REF}
    build:
      context: .
      dockerfile: docker/toolshop-ui.Dockerfile
      args:
        TOOLSHOP_REF: ${TOOLSHOP_REF:?set in .env}
        API_URL: /api
    ports:
      - '4200:4200'
    depends_on:
      - web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4200/']
      interval: 3s
      timeout: 3s
      retries: 20
